<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="sudoku-revision" content="20261030"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><title>数独 10月30日 初級 保存版</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#171717;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}.wrap{max-width:390px;margin:auto;padding:7px 9px 16px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}h1{font-size:15px;margin:0}button{font-family:inherit;touch-action:manipulation;cursor:pointer}.mode{display:flex;gap:4px}.mode button{border:1px solid #888;border-radius:6px;background:white;padding:6px 7px;font-size:12px}.mode button.active{background:#202020;color:white}.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);border:2px solid #171717;background:white}.cell{border-right:1px solid #aaa;border-bottom:1px solid #aaa;background:white;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;padding:0;position:relative;font-size:19px;color:#111;font-weight:500}.cell.given{background:#e5e5e5;font-weight:700}.cell.selected{background:#cde5ff}.cell.blockright{border-right:2px solid #111}.cell.blockbottom{border-bottom:2px solid #111}.cell.lastcol{border-right:0}.cell.lastrow{border-bottom:0}.cand{width:83%;height:83%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);align-items:center;justify-items:center;line-height:1;font-size:clamp(8px,2.5vw,10px);font-weight:500;color:#111}.cand span.off{color:transparent}.status{display:flex;justify-content:space-between;gap:4px;align-items:center;font-size:12px;margin:6px 0}.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.keys button{background:#fff;border:1px solid #999;border-radius:7px;min-height:34px;font-size:17px;font-weight:600}.tools{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.tools button,.filebtn{background:#fff;border:1px solid #888;border-radius:6px;padding:7px 9px;font-size:12px;color:#111}.filebtn{display:inline-flex;align-items:center}.help{font-size:12px;line-height:1.5;color:#555;margin:8px 0}#import{display:none}.ok{color:#126332}.warn{color:#9a4c00}@media(max-height:750px){.wrap{padding-top:3px}.cell{font-size:17px}.keys button{min-height:30px}.help{margin:4px 0}}
</style></head><body><main class="wrap"><header><h1>10月30日・初級</h1><div class="mode"><button id="answer" class="active">数字入力</button><button id="candidate">候補消去</button></div></header><div id="board" class="board" aria-label="数独盤面"></div><div class="status"><span id="pos">1行・1列</span><span id="saveStatus">保存状態を確認中</span></div><div id="keys" class="keys"></div><div class="tools"><button id="backup">途中経過を保存</button><label for="import" class="filebtn">保存データを復元</label><input type="file" id="import" accept=".json,application/json"><button id="undo">ひとつ戻す</button><button id="reset">最初から</button></div><p class="help">このゲームは個人情報の入力・送信を行いません。進行状況はこの端末のブラウザ内に保存されます。<br> 空欄を選び、下の数字を押してください。候補消去では数字を押すたびに候補が消去・復活します。保存データには入力数字と候補消去の両方が入ります。</p></main><script>
'use strict';
const givens=[0,4,0,6,0,0,0,1,8,1,0,3,0,0,0,0,0,9,0,8,2,0,0,0,5,0,0,8,0,0,1,0,6,0,0,0,0,0,0,0,3,0,0,0,0,0,0,0,4,0,9,0,0,3,0,0,1,0,0,0,9,6,0,9,0,0,0,0,0,2,0,7,4,6,0,0,0,2,0,8,0];
const KEY='sudoku-20261030-v1';
let values=givens.slice(),masks=Array(81).fill(511),selected=0,mode='answer',history=[];
const board=document.getElementById('board'),keys=document.getElementById('keys'),status=document.getElementById('saveStatus');
function valid(d){return d&&Array.isArray(d.values)&&d.values.length===81&&Array.isArray(d.masks)&&d.masks.length===81&&d.values.every((v,i)=>Number.isInteger(v)&&v>=0&&v<=9&&(!givens[i]||v===givens[i]))&&d.masks.every(v=>Number.isInteger(v)&&v>=0&&v<=511)}
try{let s=localStorage.getItem(KEY);if(s){let d=JSON.parse(s);if(valid(d)){values=d.values;masks=d.masks;status.textContent='前回の状態を復元';status.className='ok'}}}catch(e){status.textContent='自動保存不可：手動保存を利用';status.className='warn'}
function save(){try{localStorage.setItem(KEY,JSON.stringify({values,masks}));status.textContent='自動保存済み';status.className='ok'}catch(e){status.textContent='手動保存をご利用ください';status.className='warn'}}
function snapshot(){history.push({values:values.slice(),masks:masks.slice()});if(history.length>100)history.shift()}
function draw(){board.innerHTML='';for(let i=0;i<81;i++){let c=document.createElement('button');c.type='button';c.className='cell'+(givens[i]?' given':'')+(selected===i?' selected':'')+(i%9===2||i%9===5?' blockright':'')+(Math.floor(i/9)%3===2&&i<72?' blockbottom':'')+(i%9===8?' lastcol':'')+(i>=72?' lastrow':'');c.setAttribute('aria-label',`${Math.floor(i/9)+1}行${i%9+1}列`);if(values[i]){c.textContent=values[i]}else if(mode==='candidate'){let box=document.createElement('div');box.className='cand';for(let n=1;n<=9;n++){let sp=document.createElement('span');if(!(masks[i]&(1<<(n-1))))sp.className='off';sp.textContent=n;box.appendChild(sp)}c.appendChild(box)}c.addEventListener('click',()=>{selected=i;draw()});board.appendChild(c)}document.getElementById('pos').textContent=`${Math.floor(selected/9)+1}行・${selected%9+1}列`;document.getElementById('answer').classList.toggle('active',mode==='answer');document.getElementById('candidate').classList.toggle('active',mode==='candidate');keys.innerHTML='';for(let n=1;n<=10;n++){let b=document.createElement('button');b.textContent=n===10?(mode==='answer'?'消去':'復元'):n;b.addEventListener('click',()=>change(n===10?0:n));keys.appendChild(b)}}
function change(n){if(givens[selected])return;snapshot();if(mode==='answer'){values[selected]=n}else{if(n===0)masks[selected]=511;else masks[selected]^=1<<(n-1)}save();draw()}
document.getElementById('answer').onclick=()=>{mode='answer';draw()};document.getElementById('candidate').onclick=()=>{mode='candidate';draw()};document.getElementById('undo').onclick=()=>{let d=history.pop();if(!d)return;values=d.values;masks=d.masks;save();draw()};
document.getElementById('reset').onclick=()=>{if(!confirm('入力数字と候補消去をすべて初期化しますか？'))return;snapshot();values=givens.slice();masks=Array(81).fill(511);save();draw()};
document.getElementById('backup').onclick=()=>{let d={version:3,puzzle:'2026-10-30',values,masks};let blob=new Blob([JSON.stringify(d)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='数独_10月30日_途中経過.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);status.textContent='保存データを書き出しました';status.className='ok'};
document.getElementById('import').onchange=async(e)=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.puzzle!=='2026-10-30'||!valid(d))throw Error('別の問題か、データ形式が違います');snapshot();values=d.values.slice();masks=d.masks.slice();save();draw();alert('数字と候補消去を復元しました')}catch(err){alert('復元できません：'+err.message)}e.target.value=''};
draw();

// Check the live GitHub Pages HTML on every app launch and when returning to the app.
// Cache-busting on the request avoids stale Safari / home-screen caches.
const SUDOKU_REVISION='20261030';
let lastRevisionCheck=0,revisionCheckInProgress=false;
async function checkLatestPuzzle(){
  if(revisionCheckInProgress || Date.now()-lastRevisionCheck<15000 || !navigator.onLine)return;
  revisionCheckInProgress=true;lastRevisionCheck=Date.now();
  try{
    const base=location.origin+location.pathname;
    const r=await fetch(base+'?sudoku_check='+Date.now(),{cache:'no-store',redirect:'follow'});
    if(!r.ok)return;
    const html=await r.text();
    const found=html.match(/<meta\s+name=["']sudoku-revision["']\s+content=["'](\d{8})["']/i);
    if(found && found[1]!==SUDOKU_REVISION){
      location.replace(base+'?sudoku_rev='+found[1]);
    }
  }catch(e){/* Offline: keep the current puzzle usable. */}
  finally{revisionCheckInProgress=false;}
}
window.addEventListener('pageshow',checkLatestPuzzle);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkLatestPuzzle()});
</script></body></html>
